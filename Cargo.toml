[workspace]
members = [
    "crates/cfgprism-core",
    "crates/cfgprism-formats",
    "crates/cfgprism-cli",
    "crates/cfgprism-wasm",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/example/cfgprism"
version = "0.1.0"

[workspace.dependencies]
cfgprism-core = { path = "crates/cfgprism-core" }
cfgprism-formats = { path = "crates/cfgprism-formats" }
thiserror = "2"

[package]
name = "cfgprism-formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "cfgprism format implementations (one module per format)"

[dependencies]
cfgprism-core = { workspace = true }
thiserror = { workspace = true }
toml_edit = "0.22"
kdl = { version = "=6.5.0", features = ["v1-fallback"] }
ron = { version = "0.8", features = ["indexmap"] }
saphyr-parser = "0.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "convert"
harness = false


<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" font-family="Menlo, Consolas, monospace" font-size="14">
  <rect width="720" height="340" rx="8" fill="#0d1117"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ebbd2d"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="90" y="25" fill="#8b949e">cfgprism — lossless-ish conversion</text>
  <text x="20" y="60" fill="#7ee787">$ cat config.yaml</text>
  <text x="20" y="84" fill="#c9d1d9">server: &amp;srv        # shared anchor</text>
  <text x="20" y="108" fill="#c9d1d9">  host: example.com</text>
  <text x="20" y="132" fill="#c9d1d9">clients: [*srv]</text>
  <text x="20" y="166" fill="#7ee787">$ cfgprism convert config.yaml -t json</text>
  <text x="20" y="190" fill="#ffa657">cfgprism: warning: [anchor-expanded] server: anchor 'srv' expanded (JSON has no anchors)</text>
  <text x="20" y="214" fill="#c9d1d9">{</text>
  <text x="20" y="238" fill="#c9d1d9">  "server": { "host": "example.com" },</text>
  <text x="20" y="262" fill="#c9d1d9">  "clients": [{ "host": "example.com" }]</text>
  <text x="20" y="286" fill="#c9d1d9">}</text>
  <text x="20" y="320" fill="#8b949e">$ cfgprism check config.yaml config.json  # in sync</text>
</svg>
